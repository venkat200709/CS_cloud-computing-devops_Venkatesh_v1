name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Run lint check
      run: |
        python -m pip install flake8
        python -m flake8 app tests --max-line-length=120
    - name: Run pytest suite
      run: |
        pytest -v
    - name: Audit git history for secrets
      run: |
        MATCHES=$(git log -p -- . ':!.github/*' ':!scripts/*' ':!README.md' ':!docs/*' ':!evidence/*' | grep -E -i "(api[_-]?key\s*[:=]\s*['\"][^'\"]{8,}|password\s*[:=]\s*['\"][^'\"]+|bearer\s+[a-z0-9_\-\.]{15,}|BEGIN PRIVATE KEY)" || true)
        if [ -n "$MATCHES" ]; then
          exit 1
        fi
